      summary: v1.6.20-r1 (J-101) — mark a company's existing "General" rows as the default department (vp_hr only)
      description: 'Rows that read "General" before the marker existed cannot be proven defaulted, so the upgrade
        left them a normal team. Run ONLY after Karin decides that this company''s "General" is the default
        department: every "General" row with marker false gets department_is_default = true (they move to the
        "ללא מחלקה" absence row; burnout then refuses "General"). Audited (company + count only). Returns {status:
        marked, marked}.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_company_id: *id023
              required:
              - p_company_id
      responses:
