              schema:
                $ref: '#/components/schemas/AgentJson'
        '403': *id025
  /rpc/rpc_notification_message_he:
    post:
      tags:
      - agents
      summary: v1.6.20-r2 (J-101 = A) / v1.6.21 — the fixed Hebrew text of a notification kind
      description: 'default_department_review → "יש אצלכם מחלקה בשם General. אם זו ברירת המחדל ולא מחלקה אמיתית,
        אפשר לסמן אותה כך." (decisions: /rpc/rpc_notification_options_he, /rpc/rpc_resolve_default_department_review).
        v1.6.21 no_department_reminder → "יש X עובדים בלי מחלקה. כל עוד הם לא משויכים, חלק מההתראות לא יכולות
        לפעול עבורם." with X = the current count of the caller''s company, only for an active vp_hr and only while
        X > 0 (count only, no names). v1.6.21 (J-123 = B) no_department_cuckoo → "בקרב העובדים בלי מחלקה יש סימני
        העמסה של עבודה של אחרים. מומלץ לשייך את העובדים למחלקות, כדי שההתראות יגיעו למנהלת הנכונה." (J-129 approved; active vp_hr of a company with a delivered
        company-level alert; no number, no name). J-128 = A: one kind per call — the reminder count never comes in
        the same response as any metric of the no-department group. Other kinds → null. The text is
        fixed per kind (no names, no ids) and is never stored in the notification row. The notice itself is
        created once per vp_hr and company by the pack after an upgrade (re-runs add none); it is visible only
        to its recipient (/notification, RLS).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_kind
              properties:
                p_kind:
                  type: string
      responses:
        '200':
          description: Text or null
          content:
            application/json:
              schema:
                type: string
                nullable: true
  /rpc/rpc_notification_options_he:
    post:
      tags:
      - agents
      summary: v1.6.21 (J-108 = A) — the decision options of a notification kind
      description: 'default_department_review → [{decision: default_department, label_he: "ברירת מחדל"},
        {decision: real_department, label_he: "זו מחלקה אמיתית"}]. Other kinds → null.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_kind
              properties:
                p_kind:
                  type: string
      responses:
        '200':
          description: Options or null
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  type: object
                  properties:
                    decision:
                      type: string
                      enum:
                      - default_department
                      - real_department
                    label_he:
                      type: string
                      enum:
                      - ברירת מחדל
                      - זו מחלקה אמיתית
  /rpc/rpc_resolve_default_department_review:
    post:
      tags:
      - agents
      summary: v1.6.21 (J-108 = A) — vp_hr answers the "General" notice for the whole company
      description: 'vp_hr of the company only (others 403). default_department ("ברירת מחדל") marks the company''s
        "General" rows as the default department (same logic as /rpc/rpc_mark_general_as_default_department);
        real_department ("זו מחלקה אמיתית") keeps them as a real team. The decision is recorded once per company,
        written to the WORM audit log (default_department_review_resolved: company, decision, rows marked — no
        names) and removes the notice for every vp_hr; it is never created again for that company (other or new
        vp_hr, new "General" rows, pack re-apply). 400 invalid_decision; 422 default_department_already_decided.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_company_id
              - p_decision
              properties:
                p_company_id:
                  type: string
                  format: uuid
                p_decision:
                  type: string
                  enum:
                  - default_department
                  - real_department
                  description: default_department = "ברירת מחדל"; real_department = "זו מחלקה אמיתית"
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - resolved
                  decision:
                    type: string
                  label_he:
                    type: string
                  marked:
                    type: integer
        '400':
          description: invalid_decision
        '403':
          description: Not vp_hr of the company
        '422':
          description: default_department_already_decided
