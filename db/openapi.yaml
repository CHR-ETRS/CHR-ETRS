  /rpc/rpc_submit_questionnaire:
    post:
      tags:
      - rpc
      summary: Submit a questionnaire once per period (employee timezone); credits the fixed participation Golden
        Spoons
      description: 'Answers are immutable after submission (WORM → 403 questionnaire_immutable). Not locked by the
        Circuit Breaker.

        Rewards (v1.6.17, v3 §3.6 + Karin 30.10 / 31.10): participation only, the same amount whatever the answers
        — read from agent_settings via questionnaire_definition.reward_setting_key: PCQ-12, Cantril and other monthly
        questionnaires golden_spoons_per_questionnaire (10); daily and weekly (short) golden_spoons_per_short_questionnaire
        (2); IHS / TPS-12 (quarterly) golden_spoons_per_quarterly_questionnaire (10, adjustable per company). A
        setting that is "לא הוגדר" pays 0 with reward_status not_defined. No Golden Spoons are ever computed from
        a score.

        TPS-12: score = (sum−12)/48×100; items 1, 3, 5, 11 reversed (6−x); all 12 answers 1–5 required; new employees
        only after 30 days (from the team-join date, else the hire date; with neither: exempt — v1.6.8, O-49).

        IHS (O-6, Karin 24.10): 1–5 scale answers converted linearly to 0–100 ((mean − 1) / 4 × 100); participation
        reward (see above).


        PCQ-12 (O-7, Karin 24.10): 12 required items on the 1–6 Luthans scale, converted linearly to 0–100 ((mean
        − 1) / 5.0 × 100); participation reward golden_spoons_per_questionnaire (10). v1.6.18 (A-14): the three
        amounts are adjustable per company by vp_hr (1–20); a submission keeps the amount it earned (snapshot reward_golden_spoons,
        reward_setting_key, reward_effective_from) — no change is retroactive.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_code
              - p_answers
              properties:
                p_code:
                  type: string
                  enum:
                  - PCQ-12
                  - Cantril
                  - IHS
                  - TPS-12
                  description: Locked catalogue codes; HR-defined codes also accepted
                p_answers:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireSubmission'
        '403':
          $ref: '#/components/responses/BusinessError403'
        '409':
          description: questionnaire_already_submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '400':
          description: questionnaire_invalid_answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /rpc/rpc_upsert_questionnaire_definition:
    post:
      tags:
      - rpc
      summary: vp_hr — define a future questionnaire (daily..monthly); the participation reward comes from agent_settings
      description: 'Locked catalogue rows (PCQ-12, Cantril, IHS, TPS-12) cannot be changed → 403 questionnaire_locked.
        v1.6.16: no per-questionnaire amount — p_reward_amount must be null (else 400 questionnaire_reward_from_settings);
        monthly → golden_spoons_per_questionnaire (10), daily / weekly → golden_spoons_per_short_questionnaire (2).
        Out-of-range values → CHECK violation (400).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_code
              - p_name_en
              - p_name_he
              - p_frequency
              - p_item_count
              properties:
                p_code:
                  type: string
                p_name_en:
                  type: string
                p_name_he:
