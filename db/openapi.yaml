  /rpc/rpc_morning_checkin: &id014
    post:
      tags:
      - rpc
      summary: Employee morning / shift-start check-in (0–10 scales); sets reported_at + 2.0 shift golden spoons
      description: 'O-5 & O-16 (Karin 24.10): simple average of the morning 0–10 scales (pain, mental, mood; pass
        p_scales array or individual p_pain / p_mental / p_mood). Half-point scores (e.g. 4.5) are rounded in the
        employee''s favor (floor(score) → fewer spoons deducted: 0–4 → 0, 5 → 2, 6–7 → 3, 8–10 → 4). Sets spoon_budget.reported_at
        and awards 2.0 golden spoons once per employee-local workday.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_scales:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 10
                  nullable: true
                  description: 1–3 scale answers (0–10)
                p_pain:
                  type: integer
                  minimum: 0
                  maximum: 10
                  nullable: true
                p_mental:
                  type: integer
                  minimum: 0
                  maximum: 10
                  nullable: true
                p_mood:
                  type: integer
                  minimum: 0
                  maximum: 10
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpoonBudget'
        '400':
          description: checkin_invalid_scales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_midday_checkin: &id015
    post:
      tags:
      - rpc
      summary: Employee midday check-in (12:00–15:00 local, integer delta −4..+4, capped 0..12)
      description: 'O-5 (Karin 24.10): open between 12:00 and 15:00 in the employee''s local timezone (outside →
        403 midday_checkin_outside_window). Directly adjusts available spoons by an integer delta from -4 to +4
        (outside → 400 checkin_invalid_delta), capped at 12 and floored at 0, without recalculating the morning
        score.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_delta
              properties:
                p_delta:
                  type: integer
                  minimum: -4
                  maximum: 4
      responses:
        '200':
          description: OK
          content:
