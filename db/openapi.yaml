  /rpc/rpc_build_board_report:
    post:
      tags:
      - agents
      summary: Agent 3 — build_board_report(company, month) (cfo / vp_hr)
      description: 'v1.6.21 (J-115 = A, J-118): the company total includes employees without a department (never
        a separate row); when they are 1-9 the total, Happiness Debt, deprivation tax and CHR Real EBITDA are
        hidden (company_total_display_he = "אין מספיק נתונים להצגה בתקופה זו"; GAAP stays). v1.6.21-r3 (J-132 = yes):
        the company total also includes the small teams (teams with no Shadow Balance row in the month; snapshot like
        J-120), shown only as ONE merged row other_group {label_he "אחר", happiness_debt_balance, deprivation_tax}
        (no team name, no count) when it has ≥ 10 employees and the no-department group left undisplayed is 0 or ≥ 10;
        else other_group is null, and the remainder (small teams + no-department group) must be 0 or ≥ 10 or the
        total is hidden as above (same rule as /rpc/rpc_get_board_macro_metrics). The no-department group is never a
        row and never part of "אחר". Publishes only with a balanced reconciliation and the prior-period figures (unless first period),
        and (v1.6.19, Part A3) only when every metric used for pay / manager bonuses is at level ≥ 2. Fields: chr_real_ebitda
        {value, gaap_ebitda, definition_he, note_he "מדד ניהולי חלופי שמציג קשר, לא השפעה סיבתית מבודדת" (B4), text_status}, reconciliation[],
        shadow_balance[4], exported_on_exit (published batch value, J-43: amount, batch_no, label_he, display_he,
        waiting_note_he, text_status, evidence_he; behind 10 מדווחים בפועל), verification_levels (17 metrics, computed,
        with used_for_pay / used_for_manager_bonus), layers {investment_activity, adoption_usage ("אימוץ"), outcomes,
        governance, measuring_body, structure_source_doi}, measuring_body (גוף מודד CHR-ETRS), causal_note (approved 31.10, J-65 — no טיוטה),
        verification_dossiers (kept), bcr_score, deprivation_tax (12 % / 10 % display switch), turnover_above_baseline,
        misleading_margins_flag, sources[5] {topic_he, source, citation, doi, status_he}, sources_note {text_he (Karin''s exact
        A-10 binding appendix text, two lines), source, citation, doi 10.13140/rg.2.2.35568.62722, status_he טיוטה, text_status}.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_company_id: *id017
                p_month: *id020
