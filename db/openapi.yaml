      description: 'v1.6.16 (Karin 30.10): CHR Coins shelf is deferred to v2; Golden Spoons conversion is disabled
        in v1. Every call returns HTTP 422 (SQLSTATE PT422, code chr_coins_deferred_to_v2) before any check — no
