# CHR-ETRS MVP v1.6.20 · openapi.yaml
# Version: 1.6.20-mvp r2 (2026-10-31 IL; r1 = J-96 A, the default-department marker; r2 = J-101 A notice + J-102 A team groupings exclude the marker) — supersedes 1.6.19-mvp (2026-10-31 IL), 1.6.18-mvp (2026-10-31 IL), 1.6.17-mvp (2026-10-31 IL), 1.6.16-mvp (2026-10-30 IL), 1.6.13-mvp (2026-10-25 IL; 1.6.14 / 1.6.15 planned, never built), 1.6.12-mvp (2026-10-24 IL), 1.6.11-mvp (2026-10-24 IL), 1.6.10-mvp (2026-10-21 IL), 1.6.9-mvp (2026-10-21 IL), 1.6.8-mvp (2026-10-21 IL), 1.6.7-mvp (2026-10-20 22:05 IL), 1.6.6-mvp (2026-10-20 21:15 IL), 1.6.5-mvp (2026-10-20 21:00 IL), 1.6.4-mvp (2026-10-20 20:45 IL), 1.6.3-mvp, 1.6.2-mvp, 1.6.1-mvp, 1.6.0-mvp, 1.5.0-mvp and 1.4.0-mvp
openapi: 3.0.3
info:
  title: CHR-ETRS MVP v1 API
  version: 1.6.21-mvp
  description: "**v1.6.21 (Karin 31.10):**\n\
    - J-115 = A: employees without a real department are part of the company totals of מס קיפוח and Happiness\
    \ Debt and of CHR Real EBITDA (same total); never a separate row. When that remainder is 1-9 employees the\
    \ total is hidden and shows \"אין מספיק נתונים להצגה בתקופה זו\" (J-118, board report + reconciliation +\
    \ macro metrics; GAAP stays).\n\
    - J-112 = A: cuckoo for employees without a department counts at company level (threshold 10 actual\
    \ reporters), never a team row, no ids.\n\
    - J-108 = A: the \"General\" notice is created at once (new vp_hr / new real General) and has two decisions\
    \ (/rpc/rpc_resolve_default_department_review). New notification kind no_department_reminder (count only).\n\
    - v1.6.21-r1 (Karin 01.11): J-123 = B company-level cuckoo has no pseudonym / id, vp_hr gets group wording\
    \ (no_department_cuckoo); J-128 = A reminder count never with a group metric; J-121 = A 'אחר' merge in the\
    \ board-member figures; J-126 = A the 'General' notice closes itself (audited) when no real General is left.\n\
    \n**v1.6.19 (Karin 31.10 via Chief of Drive — Tsaban's papers; Tsaban & Shavit 2026, World 7(5):77):**\n\
    - J-43 (decided): the memo line \"יצא עם העוזבים\" updates only after 10 NEW leavers (distinct employees) since\
    \ the last value; until then the previous value is shown with a waiting note (טיוטה). Remediations and reversals\
    \ move it only as a batch touching ≥ 10 transfers. No 2-transfer rule.\n- `/rpc/rpc_list_leaver_transfers` is\
    \ AGGREGATE (cfo / vp_hr only; service / anon refused; audited): rows batch / batch_team (≥ 10 leavers and the\
    \ rest of the batch 0 or ≥ 10 — complementary rule) / adjustment_batch / company_total (open_balance = the published\
    \ memo line). No person, transfer or event id.\n- `/rpc/rpc_record_remediation`: no transfer can be named (400\
    \ transfer_selection_not_allowed). v1.6.19-r2 (G-3): the amount is split FIFO over the team's open transfers;\
    \ any leftover is an unattributed team remediation; the response is always status only (never 422).\
    \ A reversal returns status only.\n- A-3: ILS estimate = average cost of a redeemed spoon, 3-month moving average\
    \ (`/rpc/rpc_get_redeemed_spoon_cost_estimate`, cfo / vp_hr only); fewer than 10 purchases → \"אין עדיין מספיק\
    \ מימושים לאומדן\"; missing input → \"חסר: <field>\". spoon_cost_ils is deprecated (kept, unused). No employee\
    \ API returns an ILS-per-spoon value.\n- Verification levels 0–4 are COMPUTED (`/rpc/rpc_put_metric_verification_evidence`);\
    \ `/rpc/rpc_put_metric_assurance` → 422 verification_level_is_computed. 'תיק אימות' per metric (`/rpc/rpc_get_verification_dossier`),\
    \ kept with every published report. A metric used for pay / manager bonuses (`/rpc/rpc_put_metric_pay_linkage`)\
    \ below level 2 blocks the report (422 pay_linked_metric_below_level_2). Measuring body (גוף מודד) = CHR-ETRS;\
    \ company-side timing / wording changes are logged and cap the metric at level 1.\n- Board report layers: investment\
    \ & activity, adoption & usage (\"אימוץ\"), outcomes, governance — with inputs `/rpc/rpc_put_wellbeing_spend`,\
    \ `/rpc/rpc_put_safety_incidents`, `/rpc/rpc_put_key_role_turnover`, `/rpc/rpc_put_company_governance`, `/rpc/rpc_put_payroll_population`,\
    \ `/rpc/rpc_add_org_event`, `/rpc/rpc_put_questionnaire_items`. Sources: 5 entries with doi + status_he.\n-\
    \ Burnout: the only recommendation is \"לבדוק את תנאי העבודה בצוות\" (טיוטה). Social events (`/rpc/rpc_create_social_event`,\
    \ `/rpc/rpc_list_social_events`) are \"ללא הערכה מקצועית\": no attendance, no Golden Spoons. Cancelled absences\
    \ are not absences (J-54).\n- v1.6.19-r2 (A-16 closed): redemption rate = redeemers ÷ active employees; key\
    \ roles = role names marked by vp_hr (`/rpc/rpc_put_key_roles`, `/rpc/rpc_get_key_roles`); board absences = sickness\
    \ + unplanned only (r3: Σ `/rpc/rpc_put_team_absences` rows, also the burnout source); burnout guard adds שימוע / שיחת בירור / התראה בכתב / מעקב\
    \ ביצועים.\n- v1.6.20: the absence input `/rpc/rpc_put_team_absences` takes a \"ללא מחלקה\" row (company total\
    \ of employees without a department; only inside the board total, never shown alone, never a burnout team);\
    \ vp_hr only (J-91); the absence definition is Karin's approved text (J-88).\n- v1.6.20-r1 (J-96 = A): the\
    \ default department is a system marker (users.department_is_default), not the name \"General\"; defaulted\
    \ employees are in the \"ללא מחלקה\" row; a real \"General\" is a team (`/rpc/rpc_mark_general_as_default_department`\
    \ resolves existing ambiguous rows, J-101).\n\nPostgREST reads + RPC writes. Version 1.6.20-mvp (2026-10-31) — supersedes 1.6.19-mvp (2026-10-31), 1.6.18-mvp\
    \ (2026-10-31), 1.6.17-mvp (2026-10-31), 1.6.16-mvp (2026-10-30), 1.6.13-mvp (2026-10-25; 1.6.14 / 1.6.15 were\
    \ planned, never built), 1.6.12-mvp (2026-10-24), 1.6.11-mvp (2026-10-24), 1.6.10-mvp (2026-10-21), 1.6.9-mvp\
    \ (2026-10-21), 1.6.8-mvp (2026-10-21), 1.6.7-mvp (2026-10-20), 1.6.6-mvp (2026-10-20), 1.6.5-mvp (2026-10-20),\
    \ 1.6.4-mvp (2026-10-20), 1.6.3-mvp (2026-10-20), 1.6.2-mvp (2026-10-20), 1.6.1-mvp (2026-10-20), 1.6.0-mvp\
    \ (2026-10-20), 1.5.0-mvp (2026-10-20, morning) and 1.4.0-mvp (2026-10-06).\nSoT = ADR index + Karin's approved\
    \ locks of 2026-10-20. NLM archived — not SoT.\n\n**Timezone (N-4 revised):** NOT NULL, no DEFAULT; signup requires\
    \ valid IANA; missing → 400 `timezone_required`;\ninvalid update → 400 `invalid_timezone`. Periods (questionnaires,\
    \ spoons) use the employee's timezone.\n\n**Turnover cost (locked):** % of annual salary by tier — junior 30–50,\
    \ mid 100–150, senior 200–400.\nResults include min/max ranges + midpoint point estimate (junior 40%, mid 125%,\
    \ senior 300%; O-1). Tier defaults automatically from org_role.tier with CHRO override (O-2).\n\n**Deprivation\
    \ Tax (locked):** system-computed only.\n`deprivation_tax_amount = deprived_count × avg_annual_salary × 0.12`.\n\
    Sources: Oswald et al. JLE 2015 doi:10.1086/681096; Bellet/De Neve/Ward MS 2024 doi:10.1287/mnsc.2023.4766.\n\
    No fixed currency amount. No 13–14%. Deprived in a week = weekly avg available spoons < 5 OR weekly B_t >= 0.65\
    \ (O-3). avg_annual_salary = company-wide average annual salary of that turnover tier group (O-4).\n\n**Privacy\
    \ thresholds (lock #3, O-11):** N = distinct employees whose data ACTUALLY feeds the aggregate in that period\
    \ —\nnever team size or membership. Regular N≥5; Cuckoo, Shadow Balance and emergency N≥10; project manager\
    \ N≥5; board N≥20.\nBelow → 403 `aggregation_privacy_threshold`.\n\n**Spoons:** 12 = hard daily max. 4–5 remaining\
    \ → Fighting tasks blocked (403 `circuit_breaker_active`).\n≤3 → employee goes home; logged only as 'יציאה מוקדמת\
    \ מאושרת' + time; counts as a full workday, no sick day.\nThe Circuit Breaker never locks questionnaires or\
    \ the shop. Morning check-in (`/rpc/rpc_morning_checkin` / `/rpc/rpc_submit_morning_checkin`): simple average\
    \ of 0–10 scales with half-points floored in the employee's favor, setting `reported_at`. Midday check-in (`/rpc/rpc_midday_checkin`\
    \ / `/rpc/rpc_submit_midday_checkin`): open 12:00–15:00 employee-local time, integer delta −4..+4 clamped to\
    \ 0..12 (O-5).\n\n**Cuckoo:** employee first; 60-second veto window; then the direct manager sees the pseudonym\
    \ only\n(`/cuckoo_alert_manager_v`). The real user id is never visible to the manager.\n\n**Currencies:** golden\
    \ spoons are fractional (one decimal). One-way conversion 1 golden spoon = 50 CHR Coins;\nno reverse. In v1\
    \ only Golden Spoons are active, given for participation only at fixed amounts from `agent_settings` (completed\
    \ monthly questionnaire incl. PCQ-12 = 10, weekly / short = 2, morning shift check-in 2, signup 10; never from\
    \ answers or scores) and never expiring while active (30 days to redeem after the end of employment). CHR Coins\
    \ are deferred to v2 (O-16); `/rpc/rpc_convert_golden_to_chr` stays defined for v2 but is BLOCKED in v1: every\
    \ call → HTTP 422 `chr_coins_deferred_to_v2` (no balance change, no row).\n\n**Write rule:** ALL writes via\
    \ `POST /rpc/<function_name>` with `rpc_*` names.\nDo not POST/PATCH/DELETE entity tables directly.\n\n**Glass\
    \ Box:** Error messages MUST NOT include spoon counts or HRV numbers.\n\n**HTTP 403 business codes (locked):**\n\
    - `circuit_breaker_active`\n- `anti_get_blocked` (distinct from CB)\n- `ledger_immutable` (WORM)\n- `aggregation_privacy_threshold`\n\
    - `questionnaire_immutable` (WORM answers)\n\n**SQL → HTTP mapping:** RPCs/triggers raise with SQLSTATE `42501`\
    \ (insufficient_privilege),\n`MESSAGE`/`HINT` = business code, `DETAIL` = `http_hint=403;code=<code>`.\nPostgREST\
    \ maps `42501` → HTTP **403**, `22023`/`22004` → **400**, `23505` → **409**.\n\n**New in 1.6.0 (Karin's locks\
    \ of 2026-10-20):**\n- Red team alert (team avg spoons < 3) — team-level trend only; shown only when ≥5 employees\
    \ actually\n  reported spoons today (`/rpc/rpc_team_spoon_alert`); fewer → 403 `aggregation_privacy_threshold`.\n\
    - Shop / golden→CHR open to every user with an employee profile (managers, CEO, VPs included);\n  governance-only\
    \ users (board_chair / board_member / owner_shareholder without a profile) → 403.\n- Crypto-shredding only by\
    \ the employee herself or automatically on offboarding; HR / managers / CEO → 403\n  `crypto_shred_forbidden`.\n\
    - Pseudonyms assigned by the system (random colour + animal), unique per company, immutable\n  (`pseudonym_immutable`).\
    \ The self-set RPC is removed.\n- TPS-12 30-day rule counts from `team_joined_at` (current team); reset on internal\
    \ transfer.\n\n\n**New in 1.6.1-mvp (2026-10-20):**\n- Lock #1 (O-10): at ≤3 spoons ALL tasks are blocked, Farming\
    \ included.\n- Lock #3 (O-11): every threshold counts actual contributors (`contributor_count`), not team size.\n\
    - B1 role tree: `/org_role` (tiers 1–5, 14 seeded roles); users.`reports_to` (solid) + optional `dotted_line_to`;\n\
    \  subtree access follows the solid line only (recursive). Cycles / cross-company → 400 `reporting_line_invalid`.\n\
    - B2 access: employees no management access; managers their solid subtree (`rpc_subtree_summary`); CEO and owners\n\
    \  averages only (`rpc_company_averages`); direct managers pseudonyms only (`rpc_direct_reports_pseudonyms`);\
    \ CHRO\n  named data only with a reason (`rpc_chro_named_view`, 400 `reason_required`). Every view is audited\
    \ (WORM).\n- B3 project manager: `rpc_project_load` — load index (NULL until a formula is locked) + burnout\
    \ alert only, N≥5 contributors, audited.\n- B4 board: `rpc_board_macro_trends` — quarter/year, company or division,\
    \ closed periods only, N≥20, no drill-down.\n- B5 emergency: only the safety & emergency manager declares /\
    \ ends (3 types locked 13.10: `health_or_life_danger`,\n  `work_stopping_disaster`, `war_or_security`); immediate\
    \ roster while ACTIVE;\n  CHRO HR review afterwards (JUSTIFIED | MISUSE); access after the end refused (`emergency_not_active`).\n\
    - B6 distress button: `rpc_distress_press` (employee, manual) → 60 s grace (`rpc_distress_cancel` → silent log,\n\
    \  nothing sent) → dispatch to the safety manager (name, phone, last location, time) + CHRO awareness (no PII)\
    \ →\n  `rpc_distress_close` by the safety manager only (threat_removed | referred_to_external_help | pressed_by_mistake):\n\
    \  PII removed, record read-only (403 `distress_record_immutable`), audit row, CHRO silent notice; false alarms\n\
    \  excluded from analytics.\n\n**New in 1.6.2-mvp (2026-10-20):**\n- Emergency types named per Karin's lock\
    \ of 13.10: `health_or_life_danger` (danger to an employee's health or life),\n  `work_stopping_disaster` (fault\
    \ / disaster that stops work: fire, flood, systems down), `war_or_security`.\n- `rpc_project_load.load_index`\
    \ returns NULL: Karin defined the idea (perceived load vs. hours capacity) but no\n  formula is locked (TODO\
    \ להשלמה). `burnout_alert` = average reported spoons < 3 — the locked red team alert rule (#4).\n\n**New in\
    \ 1.6.3-mvp (2026-10-20, Karin's locks of 20.10 + Q5 / Q6):**\n- Project workload module. Employee self-report\
    \ (`/rpc/rpc_submit_workload_self_report`, weekly, WORM) is the only v1 source.\n  Personal indices EPWI_time\
    \ = Σ(T_standard×D)/W_effective, EPWI_cognitive = EPWI_time/(1−L(P)) with L = 0/20/40/60/75 %\n  for P = 1–5,\
    \ B_t (1.6.3: sigmoid, removed in 1.6.4) are returned ONLY to the employee (`/rpc/rpc_my_workload_indices`;\n\
    \  RLS: own rows only). [superseded in 1.6.4: B_t is linear and computed; P>5 counts as 5.]\n- PM: `/rpc/rpc_project_workload`\
    \ — PEWI = mean EPWI_time of the reporting project members (v1.6.7), AIDB = (1−σ_w/μ_w)×100 %, TRR (NULL until\
    \ v2),\n  M_SPOF = 1 + K_critical_single/K_total (v2 items only), at N≥5 actual respondents (else 403), every\
    \ view audited.\n  No employee identifiers in any PM output or SPOF item. `rpc_project_load` REMOVED.\n- Soft\
    \ WIP limit: >2 core projects → `wip_alert` rows for the employee and the PM (count only); never blocks.\n-\
    \ v2 integration stub `rpc_workload_integration_sync` (jira | asana | monday) — does nothing.\n- Cuckoo N≥10\
    \ counts reporters over a rolling 30-day window (locked 20.10).\n- Safety & emergency manager: outside the 5\
    \ tiers (`org_role.tier` NULL), outside the reporting cascade; access only to\n  emergency / distress events\
    \ while open.\n- Distress alert to the safety manager: push AND SMS queued together at dispatch (after the locked\
    \ 60 s cancel window).\n- Emergency misuse (Q5, locked 13.10): close → notify the declarer → talk; after a 2nd\
    \ MISUSE a declaration needs a co-signer.\n- CHRO named view (Q6, locked 12.10): any labour-law reason, free\
    \ text, required; audited (CHECK in the audit log).\n\n**New in 1.6.4-mvp (2026-10-20, Karin's decisions Q3–Q8):**\n\
    - B_t = 0.41·S + 0.37·O + 0.22·D (linear; sigmoid removed). S = (stress − 1)/4, D = (productivity drop − 1)/4\n\
    \  (both integer Likert 1–5), O = min(weekly overtime hours / 10, 1) clamped at 0. Bands: low < 0.35; medium\n\
    \  0.35 ≤ B < 0.65; high ≥ 0.65. Any missing input → NULL. Employee-only (`/rpc/rpc_my_workload_indices`).\n\
    - L(P > 5) = L(5) = 0.75.\n- Weekly self-report adds `p_stress_1to5`, `p_productivity_drop_1to5`; one per ISO\
    \ week (duplicate → 409, no\n  update in place); separate from the daily spoons check-in. Reminder = setting\
    \ (`/workload_reminder_setting`,\n  example value Thursday, end of day), never a submission rule.\n- Q4: `project.is_core`\
    \ is set explicitly by the PM — `/rpc/rpc_project_create` (is_core REQUIRED) and\n  `/rpc/rpc_project_set_core`\
    \ (PM of the project only). Only core projects count toward the soft WIP alert.\n- Q7: co-signer of a restricted\
    \ emergency declaration = the CHRO only; the CHRO never closes.\n  `rpc_emergency_misuse_close` REMOVED (close\
    \ = `rpc_emergency_end`, safety manager only).\n- Q8: `org_role.tier` mapped to Karin's 5 tiers (label only\
    \ — access unchanged).\n\n**New in 1.6.5-mvp (2026-10-20, Karin):**\n- Company calendar: `country` (ISO 3166-1\
    \ alpha-2, required) → default `week_start_dow` (IL → Sunday 0; every other\n  country → Monday 1; other exceptions\
    \ TODO להשלמה); a company may override. `last_workday_dow` and `timezone`\n  (IANA) are required with no default.\
    \ Day of week 0–6 = Sunday … Saturday. A week is always 7 days.\n- Weekly load reports are keyed by `week_start_date`\
    \ (DATE) — never an ISO week number; unique (employee,\n  week_start_date). The week is taken from `work_date`\
    \ (start date of the work / shift; a night shift counts toward\n  the day it started), not from the submission\
    \ time.\n- Reminder: the company's last workday at `reminder_time` (default 14:00, locked), company-local. Settings\
    \ via\n  `/rpc/rpc_company_settings` (read) and `/rpc/rpc_company_settings_update` (CHRO only — who may change\
    \ them is\n  TODO להשלמה). Sender `/rpc/rpc_workload_reminder_job` is a stub. `/workload_reminder_setting` REMOVED.\n\
    - Tiers 2 ↔ 3 swapped (labels only). Legacy projects migrated to `is_core = false`; new projects still choose.\n\
    \n**New in 1.6.6-mvp (2026-10-20, Chief of Drive rulings):**\n- Default `week_start_dow` = CLDR supplemental\
    \ weekData `firstDay` for the company country (generated reference\n  table; IL pinned to Sunday; a country\
    \ CLDR does not list → CLDR world default 001 = Monday). Override unchanged.\n- Upgrade backfill (legacy companies\
    \ only): last workday = day before the CLDR weekend; timezone = the country's\n  first IANA zone.tab zone; every\
    \ filled value audited as auto-filled. New companies still send both.\n- `p_work_date` must lie within employee-local\
    \ today − 14 … today + 1; outside → **422 work_date_out_of_range**.\n\n**New in 1.6.7-mvp (2026-10-20, Karin\
    \ + Chief of Drive):**\n- O-36 resolved: only the CHRO (app_role vp_hr) changes company settings; there is no\
    \ system-admin role.\n- O-41: a `week_start_dow` change is never blocked and never recalculates a stored report.\
    \ It takes effect at a\n  week boundary: `week_start_effective_from` = the first new start day on or after (current\
    \ week start + 7), so the\n  final old-rule week runs 8–13 days; every other week is 7 days, with no overlap\
    \ and no gap. History is stored with\n  effective_from (append-only) and each report's week is resolved against\
    \ the rule in force on its work_date.\n  Every change is audited (`company_week_start_change`). The rule is\
    \ recorded in ADR_GAPS as awaiting Karin's\n  confirmation (it conflicts with \"a week is always 7 days\" for\
    \ the transition week).\n- O-43: a backfilled multi-zone country keeps the first zone.tab zone with `timezone_status\
    \ = needs_review`; the CHRO\n  clears it with `/rpc/rpc_company_timezone_confirm` (audited). A legacy company\
    \ without a country has its\n  reminders on hold (`reminders_on_hold`, audited) until a country is set, which\
    \ releases them (audited).\n  XK → Europe/Belgrade and AN → America/Curacao are documented overrides in the\
    \ reference table.\n- PEWI: `/rpc/rpc_project_pewi` — mean EPWI of the project's members who reported in the\
    \ company week; below 5\n  actual reporters → `pewi: null, suppressed: true` (no 403). Every view audited; no\
    \ individual values.\n\n**New in 1.6.18-mvp (2026-10-31, Karin via Chief of Drive — fix round closing A-12,\
    \ A-13, A-14):**\n- A-12 reversal amount: every documented remediation (`/rpc/rpc_record_remediation`) is attributed\
    \ to ONE `leaver_transfer` of its team — the one named in the new optional `p_transfer_event_id`, else the team's\
    \ oldest transfer with an open balance — and never above that transfer's open balance (**422 `remediation_exceeds_transfer`**,\
    \ **422 `no_open_leaver_transfer`**), so it never reduces another leaver's share. A reversed offboarding returns\
    \ only the open balance (moved debt − its remediations; a documented 0 when fully remediated): debt 100, remediation\
    \ 30, reversal → the team gets back 70, the transfer's \"יצא עם העוזבים\" balance is 0 and the memo line drops\
    \ by 70, not 100. `/rpc/rpc_list_leaver_transfers` (vp_hr / cfo) shows each transfer (moved, remediated, reversed,\
    \ open) with no person field.\n- A-13 time benefit scheduled after exit: when the end of employment is recorded\
    \ (or moved), every approved absence scheduled after the employee-local end date is cancelled (`schedule_status`\
    \ `cancelled`, `cancel_reason` `employment_ended`) and the Golden Spoons it cost are refunded — the employee\
    \ is then in the 30-day window where only EverStore products can be bought. Idempotent; the end day itself and\
    \ earlier days are unaffected; nothing is moved earlier automatically. `/rpc/rpc_request_absence_reschedule`\
    \ is the employee's own regular request to move an absence (e.g. earlier), only while employed (403 after).\
    \ The manager view shows the cancellation as a plain HR status — no EverStore, price or Golden Spoons field\
    \ (נעילת הפרגוד).\n- A-14 questionnaire amounts per company: `golden_spoons_per_questionnaire` (monthly incl.\
    \ PCQ-12 and Cantril, default 10), `golden_spoons_per_short_questionnaire` (default 2) and `golden_spoons_per_quarterly_questionnaire`\
    \ (TPS-12 / IHS, default 10) are adjustable per company — one value for every employee (never by answers, team\
    \ or role), 1–20 (**422 `questionnaire_reward_out_of_range`**), changed by **vp_hr only** (cfo → 403 `insufficient_privilege`).\
    \ Each change is written to a WORM history (effective_from) and the WORM audit log, and applies from now on\
    \ only: each submission snapshots `reward_golden_spoons`, `reward_setting_key` and `reward_effective_from`.\
    \ Employees see the current amount before filling out: computed field `golden_spoons_reward` on `/questionnaire_definition`\
    \ (`?select=*,golden_spoons_reward`).\n\n**New in 1.6.17-mvp (2026-10-31, Karin via Chief of Drive — fix round):**\n\
    - Questionnaire participation amounts: Cantril is MONTHLY → `golden_spoons_per_questionnaire` 10 (was the short\
    \ 2); TPS-12 and IHS → `golden_spoons_per_quarterly_questionnaire` 10 (was \"לא הוגדר\" → 0), an adjustable\
    \ setting (not locked: cfo / vp_hr may override it per company with `/rpc/rpc_put_agent_setting`).\n- No time\
    \ benefits after employment ends: `/rpc/rpc_everstore_purchase` refuses a `time_benefit` item and `/rpc/rpc_log_go_home`\
    \ refuses an early leave for an ex-employee (403 `anti_get_blocked`); a DB guard blocks every early-leave /\
    \ approved-absence row for an ex-employee. During the 30-day window only EverStore products can be redeemed.\n\
    - Reversed offboarding (`/rpc/rpc_revert_offboarding`, or the HR system clearing the end date): the leaver's\
    \ Happiness Debt returns from the memo line \"יצא עם העוזבים\" to the team — a documented `leaver_reversal`\
    \ event linked to the original `leaver_transfer` (once per transfer, idempotent). No person identifier in any\
    \ agent output.\n\n**New in 1.6.16-mvp (2026-10-30, Karin + Chief of Drive — agents, agents-bot-instructions-v3\
    \ is the single source of truth):**\n- Conversion blocked: `/rpc/rpc_convert_golden_to_chr` → 422 `chr_coins_deferred_to_v2`\
    \ (\"CHR Coins shelf is deferred to v2; Golden Spoons conversion is disabled in v1\").\n- Golden Spoons by participation\
    \ only (v3 §3.6, Karin 30.10): amounts are locked `agent_settings` parameters, never code constants — `golden_spoons_per_questionnaire`\
    \ 10 (monthly incl. PCQ-12), `golden_spoons_per_short_questionnaire` 2 (weekly / short; Cantril moved to monthly\
    \ 10 in 1.6.17), `golden_spoons_per_quarterly_questionnaire` (TPS-12 / IHS) \"לא הוגדר\" → 0 with `reward_status\
    \ = not_defined` (superseded in 1.6.17: 10). The score/10 reward is removed.\n- `agent_settings` (GET / PUT\
    \ `/rpc/rpc_get_agent_settings`, `/rpc/rpc_put_agent_setting`; v3 alias `/agents/settings`) — cfo / vp_hr; open\
    \ values show \"לא הוגדר\" and are never invented.\n- Agent 1 (EverStore budget): `/rpc/rpc_get_open_golden_spoons_liability`\
    \ (cfo / vp_hr only; v3 `/agents/budget/liability`), `/rpc/rpc_run_daily_budget_summary` + `/rpc/rpc_get_daily_budget_summary`\
    \ (one summary per company-local day, only when a threshold is crossed; v3 `/agents/budget/daily-summary?date=`),\
    \ `/rpc/rpc_expire_departed_golden_spoons` (service job, day 31 after the end of employment), and the anonymous\
    \ aggregate summary `/rpc/rpc_everstore_budget_summary` / `/everstore_budget_summary_v` (vp_hr / cfo; categories\
    \ with < 5 buyers → \"אחר\" → merged into the smallest passing category, else company total only).\n- Agent\
    \ 2 (burnout forecast, group level only): `/rpc/rpc_get_burnout_trend` (v3 `/agents/burnout/{team_id}`) with\
    \ `coverage` full / partial / none, `response_rate`, `margin`, `comparable`; 5th signal (Karin 30.10): voluntary\
    \ exits + transfer requests of the last 3 months ÷ team employees ≥ 1.5 × the organization average AND ≥ 2 events\
    \ in 2 consecutive periods; sensitive — shown only for teams of ≥ 10 employees.\n- Score range gate: `/rpc/rpc_margin_of_error`,\
    \ `/rpc/rpc_can_compare` (coefficient 12.5 from `agent_settings.score_range_coefficient`; overlap → \"אין הבדל\
    \ שאפשר לקבוע\").\n- Agent 3 (board report): `/rpc/rpc_build_board_report`, `/rpc/rpc_get_board_report` (v3\
    \ `/agents/board-report/{month}`): reconciliation table, 4-line Shadow Balance, memo line \"יצא עם העוזבים\"\
    , assurance tiers, 15-question BCR score; not published without a balanced reconciliation (422).\n- Deprived\
    \ employee (O-3) now needs two consecutive weeks. `users.app_role` gains `cfo`.\n- Agent outputs never contain\
    \ person_id, user_id, pseudonym or any employee identifier.\n\n**New in 1.6.13-mvp (2026-10-25, Karin + Chief\
    \ of Drive — EverStore expansion & privacy):**\n- `shop_item_catalog` expansion: the 8 items (`theme_*`, `badge_*`)\
    \ are the opening seed catalog (`קטלוג פתיחה`), not a closed 8-item list. Adds `category` (`cosmetic`, `time_benefit`,\
    \ `health_wellbeing`, `learning`, `donation`, `experience`, `gift_card`, `merchandise`), `provider` (nullable),\
    \ `cosmetic_only` (`true` or `false` allowed for tangible benefits), `real_money_purchase_allowed = false` and\
    \ `affects_daily_energy_spoons = false` strictly locked, and any positive `price_golden_spoons > 0` across tiers\
    \ `basic`, `advanced`, `premium`, `custom`.\n- Golden Spoons never expire while the employee is active (`avatar_state.golden_spoons_expires_at`\
    \ always `NULL`); `/rpc/rpc_convert_golden_to_chr` was active on the server in 1.6.13 (superseded in 1.6.16:\
    \ blocked, 422).\n- Time-benefit voucher redemption privacy (`נעילת הפרגוד`): purchasing/redeeming a `time_benefit`\
    \ item in EverStore automatically creates a standard HR approved absence / refresh time entry (`/approved_absence_entry`\
    \ / `/approved_absence_manager_v`: `'זמן התרעננות / היעדרות מאושרת'`), so the direct manager coordinates the\
    \ schedule (`/rpc/rpc_coordinate_approved_absence`) without ever seeing that the voucher came from EverStore,\
    \ while `/shop_purchase` remains strictly hidden from managers.\n- Cleaned up all resolved `TODO` comments across\
    \ the spec.\n\n**New in 1.6.12-mvp (2026-10-24, Karin + Chief of Drive):**\n- O-7: PCQ-12 answer scale locked\
    \ as 1–6 (Luthans original scale, 12 items, all required), converted linearly to 0–100 (`(mean - 1) / 5.0 *\
    \ 100`, `fn_pcq12_score`, `questionnaire_submission.pcq12_score`).\n- O-25: Board / Tier 5 governance roles\
    \ (`board_chair`, `board_member`, `owner_shareholder`) see all company-wide organizational averages at the whole-company\
    \ level only (`/rpc/rpc_get_board_macro_metrics`, `/rpc/rpc_company_averages`: TPS-12, spoons, workload / EPWI\
    \ / PEWI, IHS, Happiness Debt, deprivation tax, CHR Real EBITDA), with `N >= 5` for regular metrics and `N >=\
    \ 10` for sensitive/Shadow Balance metrics, and never any team or individual breakdown (`403`).\n- O-14: Offboarding\
    \ crypto-shredding retention period: self-request (`/rpc/rpc_request_crypto_shred`, `/rpc/rpc_crypto_shred_pseudonym_key`)\
    \ executes immediate crypto-shredding (0-day wait); automatic offboarding (`/rpc/rpc_offboard_employee`) revokes\
    \ access & vault immediately and schedules crypto-shredding for `terminated_at + 30 days` (cancellable via `/rpc/rpc_revert_offboarding`\
    \ within 30 days), and `/rpc/rpc_run_scheduled_crypto_shred` shreds elapsed keys.\n- O-13: One ledger chain\
    \ per company (`org_id`), genesis record (`event_type = 'GENESIS'`) seeded on company creation, and `fn_ledger_verify_chain`\
    \ writes an audit alert (`ledger_chain_broken`) and blocks writes (`403 ledger_chain_broken`) on a broken chain.\n\
    - O-19 & O-20: CHRO (`vp_hr`) provisions governance-only users (`/rpc/rpc_provision_governance_user`, defaulting\
    \ `has_employee_profile = false` for tier 5 roles unless also an employee); manager private vault RPCs (`/rpc/rpc_manager_vault_open`,\
    \ `/rpc/rpc_manager_vault_put`, `/rpc/rpc_manager_vault_entries`, `/rpc/rpc_manager_vault_close`) enforce direct\
    \ manager only, office-network + company-device flags, inactivity timeout, and automatic wipe on transfer/dismissal.\n\
    \n**New in 1.6.11-mvp (2026-10-24, Karin + Chief of Drive):**\n- O-8: TPS-12 / IHS fractional score rounding\
    \ confirmed as built (round to nearest integer first, then last-digit rounding to 0 or 5, then ÷ 10; superseded\
    \ in 1.6.16 — no Golden Spoons from a score).\n- O-6: IHS score from 1–5 questionnaire answers: `(mean - 1)\
    \ / 4 * 100`, reward = score ÷ 10 (superseded in 1.6.16: participation reward from agent_settings); IHS submissions\
    \ enabled (`scoring_not_locked` removed); `ihs_team_avg` in `team_aggregate` at N≥5 respondents.\n- O-1 & O-2:\
    \ Turnover replacement cost point estimate = tier midpoint (`junior` 40%, `mid` 125%, `senior` 300%); turnover\
    \ tier defaults automatically from `org_role.tier` (1→junior, 2–3→mid, 4→senior, 5/outside→excluded unless overridden),\
    \ with CHRO (`vp_hr`) override per employee.\n- O-3, O-4 & O-18: Deprived in a week = weekly avg available spoons\
    \ < 5 OR weekly `B_t >= 0.65`; `avg_annual_salary` for Happiness Debt / Deprivation Tax = company-wide average\
    \ annual salary of that turnover tier group (never individual or small-team average); full Shadow Balance /\
    \ Happiness Debt / 12% deprivation tax / `chr_real_ebitda = gaap_reported_ebitda - happiness_debt_balance -\
    \ deprivation_tax_amount` at N≥10 respondents (`/rpc/rpc_shadow_balance_refresh`).\n- O-5 & Q5: `/rpc/rpc_morning_checkin`\
    \ (0–10 scales average, half-point scores floored in the employee's favor, sets `reported_at`, awards 2.0 shift\
    \ golden spoons once per local day) and `/rpc/rpc_midday_checkin` (open 12:00–15:00 employee-local, integer\
    \ delta −4..+4, clamped 0..12). \"Never show the deduction\" applies only to check-in survey answer options;\
    \ task costs (0, 1, 2) and golden spoon rewards remain visible.\n- O-16 / Q11: Only Golden Spoons active in\
    \ v1 (0.5 daily — superseded in 1.6.16 by the short-questionnaire setting 2 —, 2 per shift, 10 at signup); CHR\
    \ Coins deferred to v2.\n- C-1, C-2, O-30 & O-31 confirmed (soft WIP alert >2 core projects, Weinberg table\
    \ L(P)=0/20/40/60/75%, EPWI_cognitive bands ≤1.10 target / ≤1.50 above_target / >1.50 overload, population SD\
    \ σ for AIDB).\n\n**New in 1.6.10-mvp (2026-10-21, Chief of Drive) — backend frozen:**\n- A pinned country zone\
    \ (reference `main_timezone_source` 'override: …') is never `needs_review`:\n  UA → `Europe/Kyiv` is `confirmed`.\
    \ UZ keeps the capital's `Asia/Tashkent` (Asia/Samarkand excluded,\n  same offset). 24 countries need review\
    \ (25 list more than one zone).\n- Migration only (no API effect): source timezone preflight, `tz_edge_review`\
    \ audit flag, non-superuser\n  fallback lockdown of the frozen v1.4 tables (audit `legacy_guard_fallback`).\
    \ No API shape change.\n\n**New in 1.6.9-mvp (2026-10-21, Chief of Drive):**\n- O-50: `users.hire_date` is the\
    \ single employment-start field. `users.start_date` is **DEPRECATED** — a read-only\n  alias of `hire_date`\
    \ (generated column; a write is refused, SQLSTATE 428C9), no 'today' default, **removed in v1.7**.\n  Clients\
    \ read `hire_date`. A user without `hire_date` has `start_date` NULL and no TPS-12 wait.\n- Migration v1.4 →\
    \ v1.6.9: a v1.4 `start_date` equal to the record's creation date (UTC date portion) is treated as\n  unknown\
    \ (`hire_date` NULL, audited `start_date_untrusted`).\n- Zone exclusions for CY, MH, MY, PS, UZ (same UTC offset\
    \ as the kept zone) → single-zone, `timezone_status`\n  confirmed on backfill; UA pinned to Europe/Kyiv (still\
    \ needs_review: 2 zones). No API shape change.\n- DROP / ALTER of the frozen `legacy_v1_4_*` tables is blocked\
    \ by an event trigger (database only; not exposed).\n\n**New in 1.6.8-mvp (2026-10-21, Karin + Chief of Drive):**\n\
    - O-41 (replaces the 1.6.7 long week): the last old week stays **7 days**; from its end to the day before\n\
    \  `week_start_effective_from` is a **bridge of 1–6 days** — no week, no load report (**422 `bridge_period`**),\
    \ no\n  reminder. Every week is exactly 7 days; old week, bridge and new week never overlap and leave no gap.\
    \ The change\n  and the bridge dates are audited (`company_week_start_change`). Stored reports are immutable.\n\
    - O-49: the TPS-12 30-day wait starts at the team-join date, else the hire date (`users.hire_date`, nullable),\
    \ else\n  the employee is exempt; the source used is audited per user (`tps_wait_source`).\n- Unknown country\
    \ code (well-formed but not in the reference table) → **422 `unknown_country`**; a held company stays\n  held.\
    \ DE counts as single-zone (Europe/Busingen excluded as an exclave, documented exclusion list).\n- PEWI uses\
    \ the time-based EPWI (resolved). `rpc_project_workload` keeps 403 below 5 respondents (B3);\n  `rpc_project_pewi`\
    \ keeps `pewi: null, suppressed: true` — both shapes are intended."
servers:
- url: https://{projectRef}.supabase.co/rest/v1
  variables:
    projectRef:
      default: YOUR_PROJECT_REF
security:
- bearerAuth: []
tags:
- name: reads
  description: PostgREST table reads (RLS enforced)
- name: rpc
  description: SECURITY DEFINER write RPCs
- name: errors
  description: Business error contract
- name: agents
  description: 'v1.6.16 agents (v3): advisory only — no agent pays, changes a budget or messages an employee; outputs
    are group level with no employee identifier'
paths:
  /spoon_budget:
    get:
      tags:
      - reads
      summary: Read own spoon budget rows
      description: 'Readable by owner without vault consent (ADR-007/Q-002 — server needs spoons for CB).

        Managers never receive individual spoons (Glass Box).

        `budget_date` is employee-local date (N-1 IANA timezone).

        '
      parameters:
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/budgetDateEq'
      responses:
        '200':
          description: Spoon budget rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpoonBudget'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /task:
    get:
      tags:
      - reads
      summary: Read tasks for assignee/assigner (RLS)
      parameters:
      - $ref: '#/components/parameters/select'
      responses:
        '200':
          description: Task rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /avatar_state:
    get:
      tags:
      - reads
      summary: Read own avatar state (balances, shop inventory)
      responses:
        '200':
          description: Avatar state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvatarState'
  /employee_value_asset:
    get:
      tags:
      - reads
      summary: Read own employee value asset
      responses:
        '200':
          description: EVA rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeValueAsset'
  /journal_entry:
    get:
      tags:
      - reads
      summary: Read own journal ciphertext (consent required)
      description: Without consent → empty under RLS; write path raises consent_required.
      responses:
        '200':
          description: Ciphertext journal rows (no plaintext)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
  /anchor:
    get:
      tags:
      - reads
      summary: Read own anchor ciphertext (consent required)
      responses:
        '200':
          description: Ciphertext anchor rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anchor'
  /hrv_sample:
    get:
      tags:
      - reads
      summary: HRV samples — v2 ONLY (unused in v1; no client grant; CB does not read)
      responses:
        '200':
          description: v2 only — not readable by clients in v1
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HrvSample'
  /team_aggregate:
    get:
      tags:
      - reads
      summary: Manager team aggregates — regular data, N≥5
      description: 'RLS: `fn_is_org_manager(org_id)` AND `contributor_count >= 5` (actual contributors) (privacy_threshold_config.regular).

        Teams of 5–9 get regular data. Includes deprivation tax, turnover range sums and TPS-12 team average

        (`tps_team_avg`, NULL when fewer than 5 respondents). No individual spoons/HRV/PII/journals.'
      responses:
        '200':
          description: Aggregate rows (N≥5)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamAggregate'
        '403':
          $ref: '#/components/responses/AggregationPrivacy'
  /cuckoo_alert:
    get:
      tags:
      - reads
      summary: Own Cuckoo alerts (target employee only)
      responses:
        '200':
          description: Alert rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CuckooAlert'
      description: 'RLS: `auth.uid() = target_user_id`. Managers cannot read this table; they use `/cuckoo_alert_manager_v`.'
  /manager_ledger:
    get:
      tags:
      - reads
      summary: Read own ledger entries (WORM, SHA-256 hash chain, pseudonym only)
      responses:
        '200':
          description: Ledger rows (no free-text PII narrative)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagerLedger'
  /shop_item_catalog:
    get:
      tags:
      - reads
      summary: Active EverStore catalog (opening seed catalog קטלוג פתיחה + 8 categories; server prices)
      responses:
        '200':
          description: 8 opening seed cosmetic items (קטלוג פתיחה) + expandable across 8 categories (cosmetic, time_benefit,
            health_wellbeing, learning, donation, experience, gift_card, merchandise) with any positive price_golden_spoons
            > 0. CHR Coins shelf deferred to v2 (O-16). Dutch auction deferred to v2.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShopItem'
  /rpc/rpc_daily_reset_spoons:
    post:
      tags:
      - rpc
      summary: Daily spoon reset ALWAYS to 12 at employee local midnight (N-1 / Q-008)
      description: 'No debt carryover. Day boundary = `(now() AT TIME ZONE users.timezone)::date`.

        Lazy reset also runs inside CB / assign paths.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_user_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Reset spoon_budget row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpoonBudget'
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_daily_reset_spoons_job:
    post:
      tags:
      - rpc
      summary: Scheduled job — create local-day budgets at 12 for users past local midnight
      description: service_role / cron. Returns count of users processed.
      responses:
        '200':
          description: Number of users whose local-day row was created
          content:
            application/json:
              schema:
                type: integer
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_assign_task:
    post:
      tags:
      - rpc
      summary: Assign task — server computes s_base/s_final; Circuit Breaker v1.5 (spoons only)
      description: 'Client does NOT send s_base for pricing. Farming=0 (no refill), fighting normal=1, high-friction=2;
        S_final=min(...,4).

        CB: remaining 4–5 → Fighting blocked; remaining ≤3 → employee goes home, no tasks (403 `circuit_breaker_active`).

        When a debit brings the day to ≤3, the go-home entry is logged automatically.

        Insufficient spoons for cost → 403 anti_get_blocked (no numbers in message). Lock #1 (O-10): at ≤3 spoons
        ALL tasks are blocked, Farming included.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_assignee_id
              - p_task_name
              properties:
                p_assignee_id:
                  type: string
                  format: uuid
                p_task_name:
                  type: string
                p_task_kind:
                  type: string
                  enum:
                  - farming
                  - fighting
                p_high_friction:
                  type: boolean
                p_chronic_pain:
                  type: boolean
                  description: Flag only; pain deducts only via the morning/midday check-in scale (CONFLICT-2 released
                    12.10).
                p_modifiers:
                  type: array
                  items: {}
                p_shadow_work:
                  type: boolean
                p_shadow_work_tag:
                  type: string
                  nullable: true
                p_external_ref:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: circuit_breaker_active or anti_get_blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                circuitBreaker:
                  value:
                    code: circuit_breaker_active
                    message: circuit_breaker_active
                    http_status: 403
                antiGet:
                  value:
                    code: anti_get_blocked
                    message: anti_get_blocked
                    http_status: 403
  /rpc/rpc_upsert_journal_ciphertext:
    post:
      tags:
      - rpc
      summary: Upsert journal ciphertext (consent required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_encrypted_blob
              - p_encryption_iv
              properties:
                p_entry_id:
                  type: string
                  format: uuid
                  nullable: true
                p_encrypted_blob:
                  type: string
                  format: byte
                p_encryption_iv:
                  type: string
                  format: byte
                p_encryption_tag:
                  type: string
                  format: byte
                  nullable: true
                p_encryption_version:
                  type: integer
                p_prompt_code:
                  type: string
                p_shadow_work_flag:
                  type: boolean
                p_shadow_work_tag:
                  type: string
                p_is_clinical:
                  type: boolean
      responses:
        '200':
          description: Journal row (ciphertext)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '403':
          description: consent_required | consent_revoked | vault_sealed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /rpc/rpc_upsert_anchor_ciphertext:
    post:
      tags:
      - rpc
      summary: Upsert anchor ciphertext (consent required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_encrypted_blob
              - p_encryption_iv
              properties:
                p_anchor_id:
                  type: string
                  format: uuid
                  nullable: true
                p_encrypted_blob:
                  type: string
                  format: byte
                p_encryption_iv:
                  type: string
                  format: byte
                p_encryption_tag:
                  type: string
                  format: byte
                  nullable: true
                p_encryption_version:
                  type: integer
                p_lighting_type:
                  type: string
                p_territory_schema:
                  type: string
                p_exposure_gate:
                  type: string
                  enum:
                  - CLOSED
                  - FILTERED
                  - OPEN
      responses:
        '200':
          description: Anchor row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anchor'
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_cuckoo_veto:
    post:
      tags:
      - rpc
      summary: Employee sovereign veto within the 60-second window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_alert_id
              properties:
                p_alert_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuckooAlert'
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_ledger_append:
    post:
      tags:
      - rpc
      summary: Append-only ledger write (WORM)
      description: 'Hash chain computed by the server: previous_hash = current_hash of the previous entry in the
        org chain;

        current_hash = sha256(previous_hash || canonical_payload). Subject stored as HMAC pseudonym only.

        deprivation_tax_cost = system snapshot of the latest team deprivation_tax_amount. UPDATE/DELETE → 403 ledger_immutable.

        Shredded subject → 403 vault_sealed. O-13: one hash chain per company (org_id) with automatic GENESIS record;
        broken chain writes audit alert and blocks writes (403 ledger_chain_broken).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_event_type
              properties:
                p_event_type:
                  type: string
                p_amount_a:
