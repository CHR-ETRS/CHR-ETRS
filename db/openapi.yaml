  /rpc/rpc_put_team_absences:
    post:
      tags:
      - agents
      summary: v1.6.19-r3 (J-80 = A) — TOTAL absence days of one team month (vp_hr only)
      description: 'The only absence source of the burnout agent and the board. Total days per team per month
        — sickness, unplanned absence, early leave that was NOT pre-approved (each ≥ 0, one decimal). Approved
        absences / refresh time, planned vacation, EverStore time benefits and pre-approved early leave are not
        counted and have no field. No employee, no name. The team must have active employees in the month (400
        invalid_team); the total may not exceed team size × days of the month (400 invalid_amount). Replaces
        that month''s row; audited (team + month only). Board absences = Σ team rows (no row for a team with
        employees → "חסר: team_absence_input"). Replaces /rpc/rpc_put_board_absences (removed in r3). v1.6.20
        (J-92): p_team_id "ללא מחלקה" = the company-level total of the active employees without a department (blank
        or "ללא מחלקה" department) — same fields, validation, audit and vp_hr-only access (J-91); it is part of the
        board total (required when such employees exist), never shown separately and never a burnout team. With no
        such employee it is refused (400 invalid_team). v1.6.20-r1 (J-96 = A): employees of the DEFAULT department
        (system marker users.department_is_default — no department was assigned; label "General") belong to the
        "ללא מחלקה" row, and its maximum is that group × days (J-98). The default department is not a team (400
        invalid_team); a REAL department named "General" (marker false) is a normal team.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_company_id: *id023
                p_team_id:
                  type: string
                p_month: *id027
                p_sickness_days:
                  type: number
                  minimum: 0
                p_unplanned_absence_days:
                  type: number
                  minimum: 0
                p_unapproved_early_leave_days:
                  type: number
                  minimum: 0
              required:
              - p_company_id
              - p_team_id
              - p_month
              - p_sickness_days
              - p_unplanned_absence_days
              - p_unapproved_early_leave_days
      responses:
        '200':
          description: '{team, period_month, status: saved}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJson'
        '403': *id025
        '400':
          description: invalid_team | invalid_amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
