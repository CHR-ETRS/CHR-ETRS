          type: string
          format: uuid
        requested_date:
          type: string
          format: date
        entry_type:
          type: string
          enum:
          - approved_absence
        entry_text:
          type: string
          enum:
          - זמן התרעננות / היעדרות מאושרת
        schedule_status:
          type: string
          enum:
          - pending_coordination
          - coordinated
          - cancelled
    LeaverListRow:
      type: object
      description: 'v1.6.19: one aggregate row of the leaver list (batches of ≥ 10 leavers; no person, transfer
