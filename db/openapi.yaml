                type: array
                items:
                  $ref: '#/components/schemas/CompanySettings'
        '403': &id012
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_company_settings_update:
    post:
      tags:
      - rpc
      summary: CHRO changes company calendar settings
      description: 'CHRO (app_role vp_hr) of the company only — O-36 resolved (Karin 20.10): no system-admin role.
        Omitted / null = unchanged. Audited (company_settings_update; a week-start change also writes company_week_start_change).
        A week-start change is never blocked: it is scheduled at the next week boundary (O-41, see week_start_effective_from).
        An explicit p_timezone confirms the timezone (timezone_status → confirmed). Setting p_country on a held
        company releases its reminders. v1.6.8: a week-start change leaves the last old week at 7 days and opens
        a 1–6-day bridge before week_start_effective_from (no reports, no reminder). An unknown p_country → 422
        unknown_country (a held company stays held).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_week_start_dow:
                  type: integer
                  minimum: 0
                  maximum: 6
                  description: 0 = Sunday … 6 = Saturday
                  nullable: true
                p_last_workday_dow:
                  type: integer
                  minimum: 0
                  maximum: 6
                  description: 0 = Sunday … 6 = Saturday
                  nullable: true
                p_timezone:
                  type: string
                  nullable: true
                p_reminder_time:
                  type: string
                  nullable: true
                  example: '14:00'
                p_country:
                  type: string
                  nullable: true
                  description: ISO 3166-1 alpha-2 (case-insensitive, stored uppercase).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id011
        '400':
          description: HTTP 400 (SQLSTATE 22023 / 22004)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403': *id012
        '422':
          description: 'HTTP 422 unknown_country (SQLSTATE PT422): well-formed ISO code not in the country reference
            table'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                code: unknown_country
                message: unknown_country
                http_status: 422
