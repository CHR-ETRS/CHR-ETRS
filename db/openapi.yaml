  /rpc/rpc_revert_offboarding:
    post:
      tags:
      - rpc
      summary: Revert termination within the 30-day retention window and cancel scheduled crypto-shredding (O-14)
      description: 'O-14 (Karin 24.10): callable by CHRO (vp_hr) or service_role within 30 days of termination before
        the pseudonym key is shredded. Clears employment_ended_at and scheduled_shred_at. If 30 days have elapsed
        or the key is already shredded → 403 offboarding_shred_already_executed. v1.6.17 (A-8, Karin 31.10): the
        latest leaver_transfer of this employee is reversed — a leaver_reversal event (same team, period = company
        month of the reversal, linked to the original transfer) returns the Happiness Debt from the memo line "יצא
        עם העוזבים" to the team. Once per transfer: a second call → 403 anti_get_blocked and no second reversal.
        v1.6.18 (A-12): the amount returned is the transfer''s open balance = moved debt − the documented remediations
        attributed to that transfer (0 when fully remediated, still recorded), so nothing is counted twice and no
        other leaver''s share moves. v1.6.18 (A-13): time benefits cancelled at exit stay cancelled (their Golden
        Spoons were refunded).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_user_id
              properties:
                p_user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '403':
          $ref: '#/components/responses/BusinessError403'
