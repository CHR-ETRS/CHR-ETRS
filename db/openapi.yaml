  /rpc/rpc_submit_workload_self_report:
    post:
      tags:
      - rpc
      summary: Employee weekly workload self-report (v1 only source)
      description: 'WEEKLY: one per employee per COMPANY week, keyed by week_start_date (computed from p_work_date
        and the company week start); a duplicate is rejected (409), never updated in place. Separate from the daily
        spoons check-in. Any weekday accepted (the reminder is a setting). Invalid → 400 workload_invalid_answers.
        v1.6.6: work date out of range → 422 work_date_out_of_range. v1.6.8: work date inside a week-start bridge
        → 422 bridge_period.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_contract_hours:
                  type: number
                  exclusiveMinimum: true
                  minimum: 0
                  maximum: 168
                p_hours_worked:
                  type: number
                  minimum: 0
                  maximum: 168
                p_overtime_hours:
                  type: number
                  minimum: 0
                  description: Weekly overtime hours ≥ 0 (O = min(h/10, 1)).
                p_parallel_projects:
                  type: integer
                  minimum: 0
                p_stress_1to5:
                  type: integer
                  minimum: 1
                  maximum: 5
                  nullable: true
                  description: Stress, integer Likert 1–5 (S). NULL → B_t NULL.
                p_productivity_drop_1to5:
                  type: integer
                  minimum: 1
                  maximum: 5
                  nullable: true
                  description: Productivity drop, integer Likert 1–5 (D, positive weight). NULL → B_t NULL.
                p_work_date:
                  type: string
                  format: date
                  nullable: true
                  description: 'Start date of the work / shift reported (a night shift counts toward the day it
                    started). Decides the week. Omitted → employee-local today. Allowed: employee-local today −
                    14 … today + 1 (her own timezone); outside → 422 work_date_out_of_range.'
              required:
              - p_contract_hours
              - p_hours_worked
              - p_overtime_hours
              - p_parallel_projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    report_id: &id007
                      type: string
                      format: uuid
                    week_start_date:
                      type: string
                      format: date
        '400': &id008
          description: HTTP 400 (SQLSTATE 22023)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403': &id006
          $ref: '#/components/responses/BusinessError403'
        '409':
          description: HTTP 409 (SQLSTATE 23505)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: 'HTTP 422 (SQLSTATE PT422): work_date_out_of_range — work date outside employee-local today
            − 14 … today + 1; bridge_period — work date inside a week-start bridge (no week, no report)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                work_date_out_of_range:
                  summary: Work date out of range
                  value:
                    code: work_date_out_of_range
                    message: work_date_out_of_range
                    http_status: 422
                bridge_period:
                  summary: Work date inside a bridge
                  value:
                    code: bridge_period
                    message: bridge_period
                    http_status: 422
