      summary: Board / Tier 5 whole-company organizational macro metrics (N≥5 regular, N≥10 Shadow Balance, O-25)
      description: 'O-25 (Karin 24.10): callable by Tier 5 governance roles (board_chair, board_member, owner_shareholder).
        Returns whole-company organizational averages only (TPS-12, spoons, workload / EPWI / PEWI, IHS at N≥5 respondents;
        Happiness Debt, 12% deprivation tax, Shadow Balance, CHR Real EBITDA at N≥10 contributors), with no team
        or individual breakdown. v1.6.21 (J-115 = A): employees without a department are inside the totals;
        when they are 1-9 the sensitive block (debt, tax, Shadow Balance, CHR Real EBITDA) is null (J-118).
        v1.6.21 (J-121 = A): small teams without a team row are merged into one "אחר" row (other_*) when it has ≥ 10
        and the rest is 0 or ≥ 10; else the remainder (small teams + no-department group) must be 0 or ≥ 10, or the
        sensitive block is null with company_total_display_he. v1.6.21-r3 (J-132): the board report applies the
        same rule to its month total (other_group).'
