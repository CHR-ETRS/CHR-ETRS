  /rpc/rpc_signup_profile:
    post:
      tags:
      - rpc
      summary: Create/ensure users profile after auth signup (N-4 revised)
      description: 'Called after Supabase Auth creates `auth.users`.

        **`p_timezone` is required** and must be a valid IANA name (no server DEFAULT).

        Client SHOULD auto-detect via `Intl.DateTimeFormat().resolvedOptions().timeZone`.

        If detection fails: user picks country of residence; if that country has multiple zones,

        also ask region/city — client maps to IANA. **No country→zone table on the server.**

        Optional `p_country_code` (ISO 3166-1 alpha-2) is stored for UX only.

        Missing/empty timezone → 400 `timezone_required`; invalid → 400 `invalid_timezone`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_email
              - p_full_name
              - p_timezone
              properties:
                p_email:
                  type: string
                  format: email
                p_full_name:
                  type: string
                p_timezone:
                  type: string
                  description: 'Required IANA timezone. Prefer device auto-detect; else country(/region) pick

                    mapped on the **client** (not the server).

                    '
                  example: Europe/London
                p_country_code:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: ^[A-Z]{2}$
                  nullable: true
                  description: 'Optional ISO 3166-1 alpha-2. Informational only — server does not map

                    country to timezone.

                    '
                  example: GB
                p_company_id:
                  type: string
                  format: uuid
                  nullable: true
                p_department:
                  type: string
                  nullable: true
                  description: v1.6.20-r1 (J-96 = A) — omitted / blank → the default department (label "General"
                    + system marker department_is_default, counted in the "ללא מחלקה" absence row); an explicit
                    "General" is a real team. A re-signup without it keeps the current department.
                p_app_role:
                  type: string
                  enum:
                  - employee
                  - manager
                  - vp_hr
                  - legal_ethics
                  default: employee
      responses:
        '200':
          description: users row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: timezone_required (missing/empty) or invalid_timezone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                required:
                  value:
                    code: timezone_required
                    message: timezone_required
                    http_status: 400
                invalid:
                  value:
                    code: invalid_timezone
                    message: invalid_timezone
                    http_status: 400
        '403':
          $ref: '#/components/responses/BusinessError403'
  /rpc/rpc_update_profile_timezone:
    post:
      tags:
      - rpc
      summary: Update own IANA timezone (and optional country_code) — profile, N-4
      description: 'Explicit profile change. `p_timezone` required on this call when updating zone.

        Invalid zone → HTTP **400** `invalid_timezone` (SQLSTATE 22023); existing value kept.

        Empty → 400 `timezone_required`. To keep current timezone, omit this RPC (do not call).

        Optional `p_country_code` updates country when provided (client-side mapping only).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_timezone
              properties:
                p_timezone:
                  type: string
                  description: IANA timezone name (e.g. Europe/London)
                  example: America/New_York
                p_country_code:
                  type: string
                  minLength: 2
                  maxLength: 2
                  pattern: ^[A-Z]{2}$
                  nullable: true
                  description: Optional ISO 3166-1 alpha-2; no server country→zone mapping
                  example: US
      responses:
        '200':
          description: Updated users row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: timezone_required or invalid_timezone — existing timezone kept on invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalid:
                  value:
                    code: invalid_timezone
                    message: invalid_timezone
                    http_status: 400
                required:
                  value:
                    code: timezone_required
                    message: timezone_required
                    http_status: 400
        '403':
          $ref: '#/components/responses/BusinessError403'
