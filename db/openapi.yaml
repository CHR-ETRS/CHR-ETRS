      summary: Agent 2 — get_burnout_trend(team) (v3 GET /agents/burnout/{team_id})
      description: 'coverage full (≥ 10 מדווחים בפועל) | partial (5–9: PCQ-12 + absences only, "מגמה חלקית")
        | none (< 5: "אין מספיק מדווחים בפועל להצגה"); response_rate, margin, comparable. "סיכון עולה" = ≥ 1 signal
        crossing its threshold in 2 consecutive periods of the 3-month moving average. 5th signal (team_movements):
        events of the last 3 months ÷ team employees ≥ 1.5 × organization average AND ≥ 2 events, shown only with
        full coverage and ≥ 10 employees. 12 כפיות are never read. cfo / vp_hr or a manager whose subtree holds
        a team member. v1.6.19 (A4): recommendation_he = "לבדוק את תנאי העבודה בצוות" (recommendation_text_status
        טיוטה) only when rising_risk; never more feedback, documentation or an improvement plan / PIP. v1.6.19-r3
        (J-80 = A): signals.absences (was approved_absences) = total team days from /rpc/rpc_put_team_absences
        (sickness + unplanned + unapproved early leave; approved / refresh / time benefits / vacation / pre-approved
        early leave not counted); month input missing → display_he "חסר: team_absence_input", used_in_risk false
        (the term is skipped, the other signals run unchanged); < 5 active employees → not shown. v1.6.20: definition_he
        = Karin''s approved 3-line text (J-88, no טיוטה); p_team_id "ללא מחלקה" or blank → 400 invalid_team (J-92).'
