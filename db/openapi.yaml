  /rpc/rpc_everstore_purchase:
    post:
      tags:
      - rpc
      summary: EverStore purchase — any positive price_golden_spoons > 0 across 8 categories; CB does not block
        shop
      description: 'Client does not send price. Golden-spoons shelf supports the 8 opening seed items (קטלוג פתיחה)
        and any active item across all 8 categories (cosmetic, time_benefit, health_wellbeing, learning, donation,
        experience, gift_card, merchandise) with any positive price_golden_spoons > 0. CHR Coins shelf is deferred
        to v2 (O-16) → refused in v1. Dutch auction deferred to v2. Circuit Breaker does not lock the shop. Idempotency
        via key in Avatar_State JSONB and shop_purchase. Lock #6 (O-20): any user with an active employee profile
        (has_employee_profile = true, including managers buying for themselves) can purchase; pure management/governance
        accounts without an employee profile receive 403 anti_get_blocked. Time-benefit privacy (נעילת הפרגוד):
        purchasing a time_benefit item automatically creates a standard HR approved absence / refresh time entry
        (זמן התרעננות / היעדרות מאושרת) with zero link to EverStore. v1.6.17 (J-15, Karin 31.10): after employment
        ends no time benefit — a departed employee may redeem only EverStore products (non-time_benefit categories)
        during the 30-day window; a time_benefit item → 403 anti_get_blocked, with no charge and no approved-absence
        row.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_item_id
              - p_idempotency_key
              properties:
                p_item_id:
                  type: string
                p_idempotency_key:
                  type: string
                p_requested_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional requested date for a time_benefit item (defaults to employee-local today).
      responses:
