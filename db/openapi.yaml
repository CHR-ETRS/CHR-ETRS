          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentJson'
        '403':
          description: insufficient_privilege — not the vp_hr of the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '400':
          description: invalid_social_event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /rpc/rpc_list_social_events:
    post:
      tags:
      - agents
      summary: A5 — list social events (active employees of the company)
      description: title_he, event_date, evaluation_label_he ("ללא הערכה מקצועית") only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                p_company_id: *id023
              required:
              - p_company_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    social_event_id: *id023
                    title_he: *id026
                    event_date: *id027
                    evaluation_label_he:
                      type: string
                      enum:
                      - ללא הערכה מקצועית
        '403':
          description: insufficient_privilege — not an active employee of the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT. app_role = privilege class (employee|manager|vp_hr=CHRO|legal_ethics|owner_shareholder|board_*|cfo
        — v1.6.16 agents finance viewer); org_role_code = position in the role tree.
  parameters:
    select:
      name: select
      in: query
      schema:
        type: string
      description: PostgREST column selection
    budgetDateEq:
      name: budget_date
      in: query
      schema:
        type: string
        format: date
      description: eq.<date> filter (PostgREST); employee-local date (N-1)
  responses:
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    BusinessError403:
      description: 'Business rule failure → HTTP 403. SQLSTATE 42501 + HINT business code.

        Codes: circuit_breaker_active | anti_get_blocked | ledger_immutable | questionnaire_immutable | others.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    AggregationPrivacy:
      description: Below the privacy threshold — counted on ACTUAL contributors (regular / project N<5; cuckoo /
        shadow balance / emergency N<10; board N<20) or non-manager — HTTP 403 aggregation_privacy_threshold
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            code: aggregation_privacy_threshold
            message: aggregation_privacy_threshold
            http_status: 403
  schemas:
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Business error code
          enum:
          - circuit_breaker_active
          - anti_get_blocked
          - ledger_immutable
          - aggregation_privacy_threshold
          - consent_required
          - consent_revoked
          - vault_sealed
          - timezone_required
          - invalid_timezone
          - questionnaire_immutable
          - questionnaire_already_submitted
          - questionnaire_not_eligible
          - questionnaire_invalid_answers
          - questionnaire_locked
          - pseudonym_required
          - invalid_amount
          - pseudonym_immutable
          - crypto_shred_forbidden
          - access_denied
          - reason_required
          - reporting_line_invalid
          - emergency_not_active
          - emergency_already_active
          - emergency_review_not_pending
          - invalid_period
          - invalid_review_outcome
          - invalid_location
          - distress_grace_expired
          - distress_record_immutable
          - workload_invalid_answers
          - workload_report_already_submitted
          - invalid_provider
          - emergency_not_pending_cosign
          - emergency_misuse_sequence
          - project_is_core_required
          - project_name_required
          - invalid_company_setting
          - workload_week_invalid
          - work_date_out_of_range
          - bridge_period
          - unknown_country
          - checkin_invalid_scales
          - checkin_invalid_delta
          - midday_checkin_outside_window
          - ledger_chain_broken
          - offboarding_shred_already_executed
          - invalid_governance_role
          - manager_vault_environment_denied
          - manager_vault_session_expired
          - invalid_vault_timeout
          - invalid_shop_item
          - invalid_shop_category
          - chr_coins_deferred_to_v2
          - insufficient_privilege
          - unknown_setting
          - setting_locked
          - invalid_setting_value
          - questionnaire_reward_from_settings
          - invalid_response_rate
          - invalid_score
          - invalid_date_range
          - invalid_remediation
          - invalid_bcr_answers
          - invalid_assurance_tier
          - invalid_sensitivity_rate
          - reconciliation_missing
          - reconciliation_prior_period_missing
          - reconciliation_unbalanced
          - board_report_not_published
          - questionnaire_reward_out_of_range
          - remediation_exceeds_transfer
          - no_open_leaver_transfer
          - invalid_requested_date
          - invalid_key_roles
          - invalid_team
          - invalid_decision
          - default_department_already_decided
        message:
          type: string
          description: 'Must equal code (or human text WITHOUT spoon/HRV numbers). Glass Box.

            '
        http_status:
          type: integer
          description: 'Locked HTTP 403 for circuit_breaker_active, anti_get_blocked,

            ledger_immutable, and aggregation_privacy_threshold

            (SQLSTATE 42501 → PostgREST 403).

            HTTP 400: timezone_required (SQLSTATE 22004, null_value_not_allowed) on missing/empty;

            invalid_timezone (SQLSTATE 22023) on bad IANA — signup or profile UPDATE.

            HTTP 409: questionnaire_already_submitted (SQLSTATE 23505).

            HTTP 400: questionnaire_invalid_answers, invalid_amount (SQLSTATE 22023).

            HTTP 403 also: pseudonym_immutable, crypto_shred_forbidden (SQLSTATE 42501).

            v1.6.1: 403 access_denied, emergency_not_active, emergency_review_not_pending, distress_grace_expired,
            distress_record_immutable (42501);

            400 reason_required, reporting_line_invalid, invalid_period, invalid_review_outcome, invalid_location
            (22023);

            409 emergency_already_active (23505).

            v1.6.3: 400 workload_invalid_answers, invalid_provider; 409 workload_report_already_submitted; 403 emergency_not_pending_cosign,
            emergency_misuse_sequence.

            v1.6.4: 400 project_is_core_required, project_name_required.

            v1.6.5: 400 invalid_company_setting, workload_week_invalid.

            v1.6.6: 422 work_date_out_of_range (SQLSTATE PT422 → PostgREST 422).

            v1.6.8: 422 bridge_period, unknown_country (SQLSTATE PT422 → PostgREST 422).

            v1.6.18: 422 questionnaire_reward_out_of_range, remediation_exceeds_transfer, no_open_leaver_transfer
            (PT422); 400 invalid_requested_date (22023).

            '
        details:
          type: object
          additionalProperties: true
          description: Must not include spoon or HRV numeric fields
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        timezone:
          type: string
          description: 'IANA timezone (N-1 / N-4 revised). NOT NULL, no DEFAULT.

            Signup: required; client auto-detect or country(/region) pick mapped on client.

            Missing → 400 timezone_required; invalid → 400 invalid_timezone.

            Profile update: invalid → 400 invalid_timezone (value kept).

            '
          example: Europe/London
        country_code:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: 'Optional ISO 3166-1 alpha-2. Informational; country→zone mapping is client-side only.

            '
          example: GB
        app_role:
          type: string
          enum:
          - employee
          - manager
          - vp_hr
          - legal_ethics
          - board_chair
          - board_member
          - owner_shareholder
